# Local PostgreSQL for the online mode, with the schema created automatically.
#   docker compose up -d        start the database (first start creates the tables)
#   docker compose down -v      stop it AND wipe the data (schema is re-created next start)
# Credentials match Logic/API/GuildManager.Api/appsettings.json.
services:
  db:
    image: postgres:16
    container_name: guildmanager-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: guildmanager
    ports:
      - "5432:5432"
    volumes:
      - guildmanager-data:/var/lib/postgresql/data
      # Scripts in /docker-entrypoint-initdb.d run in alphabetical order, once,
      # the first time the data volume is created.
      - ./Logic/Database/01_players.sql:/docker-entrypoint-initdb.d/01_players.sql:ro
      - ./Logic/Database/02_guilds.sql:/docker-entrypoint-initdb.d/02_guilds.sql:ro
      - ./Logic/Database/03_guild_memberships.sql:/docker-entrypoint-initdb.d/03_guild_memberships.sql:ro
      - ./Logic/Database/04_adventurers.sql:/docker-entrypoint-initdb.d/04_adventurers.sql:ro
      - ./Logic/Database/05_quests.sql:/docker-entrypoint-initdb.d/05_quests.sql:ro
      - ./Logic/Database/06_quest_assignments.sql:/docker-entrypoint-initdb.d/06_quest_assignments.sql:ro

volumes:
  guildmanager-data:
